<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <link rel="stylesheet" type="text/css" href="login.css">
    <script>
      function validateLogin() {
    var username = document.getElementById("username").value;
    var password = document.getElementById("password").value;
    var error = document.getElementById("error");

    // Basic client-side validation
    if (username === "user" && password === "pass") {
        // For demonstration, you can redirect to another page upon successful login
        // For instance, window.location.href = "dashboard.html";
        return true;
    } 
    else {
        error.innerHTML = "Invalid username or password";
        return false;
        }
}
    </script>
</head>
<body>
    <div class="login-container">
        <h2>Login</h2>
        <form action="flowers.html" id="loginForm" onsubmit="return validateLogin()">
            <!-- <form action="credit.html"> -->
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            
           <input type="submit" value="Login">
            <!-- <p id="error" class="error-message"></p> -->
            <div class="sign">
            <p>or</p>
           <a href="signup.html"><button>Signup</a></button>
           <!-- <form action="signup.html"><button>Signup</button></form> -->
          </div>
        </form>
    </div>
</body>
</html>
